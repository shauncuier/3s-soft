<!-- @dsCard group="Forms" height=300 subtitle="Default with hint, error" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<form class="ds-root" style="padding:24px;display:grid;gap:20px;max-width:440px" onsubmit="event.preventDefault()">
  <div class="ds-field"><label class="ds-field__label" for="store">Store or listing URL</label><input class="ds-field__input" id="store" type="url" placeholder="https://www.amazon.com/dp/…" aria-describedby="store-hint"><span class="ds-field__hint" id="store-hint">An Amazon, Shopify, Walmart, Etsy or eBay link.</span></div>
  <div class="ds-field ds-field--error"><label class="ds-field__label" for="email">Email</label><input class="ds-field__input" id="email" type="email" value="seller@shop" aria-invalid="true" aria-describedby="email-err"><span class="ds-field__error" id="email-err"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Enter a full email address, like name@shop.com.</span></div>
</form>
